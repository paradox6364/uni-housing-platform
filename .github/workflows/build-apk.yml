name: Build Android APK (Web + Backend Connected)

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'اللينك'
        required: false
        default: ''
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies & Capacitor
        working-directory: ./frontend-web
        run: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets for Mobile Shell
        working-directory: ./frontend-web
        env:
          LIVE_WEB_URL: ${{ github.event.inputs.web_url }}
        run: |
          mkdir -p mobile-dist
          cat << 'EOF' > mobile-dist/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>UniHousing</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body, html { width: 100%; height: 100%; height: 100dvh; background: #050b14; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
              .loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #050b14 0%, #0f2138 65%, #142B4A 100%); color: #fff; z-index: 10; transition: opacity 0.25s ease; }
              .seam { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: linear-gradient(to bottom, transparent 10%, #10B981 50%, transparent 90%); box-shadow: 0 0 25px #10B981; opacity: 0.9; pointer-events: none; }
              .logo-frame { position: relative; width: 96px; height: 96px; border-radius: 24px; background-color: #0a1626; border: 2px solid rgba(16, 185, 129, 0.5); box-shadow: 0 0 50px rgba(20, 43, 74, 0.8), inset 0 0 20px rgba(16, 185, 129, 0.25); display: flex; align-items: center; justify-content: center; }
              .title { margin-top: 16px; letter-spacing: 0.32em; font-size: 12px; font-weight: 800; color: #e0e7ff; text-transform: uppercase; }
              iframe { width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
            </style>
          </head>
          <body>
            <div id="splash" class="loader" dir="ltr">
              <div class="seam"></div>
              <div class="logo-frame">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width: 64px; height: 64px; border-radius: 16px; display: block; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
                  <defs>
                    <linearGradient id="splashOxfordBg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#334E68" />
                      <stop offset="50%" stop-color="#142B4A" />
                      <stop offset="100%" stop-color="#0A1626" />
                    </linearGradient>
                    <linearGradient id="splashSteelTint" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#F0F4F8" />
                      <stop offset="100%" stop-color="#BCCCDC" />
                    </linearGradient>
                  </defs>
                  <rect width="512" height="512" rx="112" fill="url(#splashOxfordBg)" />
                  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#9FB3C8" stroke-opacity="0.22" stroke-width="6" />
                  <path d="M256 124 L388 190 L256 256 L124 190 Z" fill="#FFFFFF" />
                  <path d="M358 205 V264" stroke="#9FB3C8" stroke-width="16" stroke-linecap="round" />
                  <circle cx="358" cy="274" r="15" fill="#10B981" />
                  <path d="M168 228 L256 272 L344 228 V346 A30 30 0 0 1 314 376 H284 V322 A28 28 0 0 0 228 322 V376 H198 A30 30 0 0 1 168 346 Z" fill="url(#splashSteelTint)" />
                </svg>
              </div>
              <div class="title">UniHousing</div>
            </div>
            <iframe
              id="app-frame"
              src="https://uni-housing-platform.vercel.app"
              allow="geolocation; fullscreen"
              onload="var s=document.getElementById('splash'); s.style.pointerEvents='none'; s.style.opacity='0'; setTimeout(function(){s.style.display='none';}, 250);"
            ></iframe>
          </body>
          </html>
          EOF
          if [ -n "$LIVE_WEB_URL" ]; then
            sed -i "s|https://uni-housing-platform.vercel.app|$LIVE_WEB_URL|g" mobile-dist/index.html
          fi

      - name: Initialize Capacitor & Generate Android Project with Header Icon
        working-directory: ./frontend-web
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.unihousing.app",
            "appName": "UniHousing",
            "webDir": "mobile-dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          mkdir -p resources

          cat << 'EOF' > resources/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
            <defs>
              <linearGradient id="oxfordBrandBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#334E68" />
                <stop offset="50%" stop-color="#142B4A" />
                <stop offset="100%" stop-color="#0A1626" />
              </linearGradient>
              <linearGradient id="steelHouseTint" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F0F4F8" />
                <stop offset="100%" stop-color="#BCCCDC" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#oxfordBrandBg)" />
            <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#9FB3C8" stroke-opacity="0.2" stroke-width="4" />
            <path d="M256 124 L388 190 L256 256 L124 190 Z" fill="#FFFFFF" />
            <path d="M358 205 V264" stroke="#9FB3C8" stroke-width="14" stroke-linecap="round" />
            <circle cx="358" cy="274" r="13" fill="#10B981" />
            <path d="M168 228 L256 272 L344 228 V346 A30 30 0 0 1 314 376 H284 V322 A28 28 0 0 0 228 322 V376 H198 A30 30 0 0 1 168 346 Z" fill="url(#steelHouseTint)" />
          </svg>
          EOF

          cat << 'EOF' > resources/icon-foreground.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
            <defs>
              <linearGradient id="steelHouseTintFg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F0F4F8" />
                <stop offset="100%" stop-color="#BCCCDC" />
              </linearGradient>
            </defs>
            <g transform="translate(64, 64) scale(0.75)">
              <path d="M256 124 L388 190 L256 256 L124 190 Z" fill="#FFFFFF" />
              <path d="M358 205 V264" stroke="#9FB3C8" stroke-width="14" stroke-linecap="round" />
              <circle cx="358" cy="274" r="13" fill="#10B981" />
              <path d="M168 228 L256 272 L344 228 V346 A30 30 0 0 1 314 376 H284 V322 A28 28 0 0 0 228 322 V376 H198 A30 30 0 0 1 168 346 Z" fill="url(#steelHouseTintFg)" />
            </g>
          </svg>
          EOF

          cat << 'EOF' > resources/splash.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
            <defs>
              <linearGradient id="splashCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#050B14" />
                <stop offset="65%" stop-color="#0F2138" />
                <stop offset="100%" stop-color="#142B4A" />
              </linearGradient>
              <linearGradient id="splashBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#334E68" />
                <stop offset="50%" stop-color="#142B4A" />
                <stop offset="100%" stop-color="#0A1626" />
              </linearGradient>
              <linearGradient id="splashHouseTint" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F0F4F8" />
                <stop offset="100%" stop-color="#BCCCDC" />
              </linearGradient>
            </defs>
            <rect width="2732" height="2732" fill="url(#splashCanvasBg)" />
            <g transform="translate(1110, 1110)">
              <rect width="512" height="512" rx="112" fill="url(#splashBadgeBg)" />
              <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#9FB3C8" stroke-opacity="0.22" stroke-width="6" />
              <path d="M256 124 L388 190 L256 256 L124 190 Z" fill="#FFFFFF" />
              <path d="M358 205 V264" stroke="#9FB3C8" stroke-width="16" stroke-linecap="round" />
              <circle cx="358" cy="274" r="15" fill="#10B981" />
              <path d="M168 228 L256 272 L344 228 V346 A30 30 0 0 1 314 376 H284 V322 A28 28 0 0 0 228 322 V376 H198 A30 30 0 0 1 168 346 Z" fill="url(#splashHouseTint)" />
            </g>
          </svg>
          EOF

          cp resources/icon.svg src/app/icon.svg
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#142B4A' --iconBackgroundColorDark '#142B4A' --splashBackgroundColor '#050B14' --splashBackgroundColorDark '#050B14'

      - name: Enable Internet Permission & Cleartext Traffic in AndroidManifest
        working-directory: ./frontend-web/android/app/src/main
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: ./frontend-web/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" app/build.gradle
          cat << 'EOF' >> app/build.gradle

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniHousing-Android-APK
          path: frontend-web/android/app/build/outputs/apk/debug/app-debug.apk