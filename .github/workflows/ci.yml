name: UniHousing Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Validate Backend
        working-directory: ./backend
        run: |
          npm install
          npx prisma validate
      - name: Install & Build Web Frontend
        working-directory: ./frontend-web
        run: |
          npm install
          npm run build
